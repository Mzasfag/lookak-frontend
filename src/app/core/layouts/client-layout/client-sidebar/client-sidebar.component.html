<aside
  [class]="isOpen() ? 'translate-x-0' : 'translate-x-full'"
  class="fixed inset-y-0 right-0 z-40 flex w-72 flex-col bg-surface-container-lowest shadow-2xl shadow-primary/10 ring-1 ring-outline-variant/20 transition-transform duration-300 lg:static lg:inset-y-auto lg:h-full lg:translate-x-0 lg:w-64"
  aria-label="القائمة الجانبية للعميل"
>
  <!-- Brand header -->
  <div class="flex items-center gap-3 border-b border-outline-variant/30 px-4 py-4 sm:px-5 sm:py-5">
    <img
      src="lookak-without-bg.png"
      alt="شعار لوَكك"
      class="h-10 w-10 rounded-full bg-brand-gold/15 object-cover p-1 ring-1 ring-brand-gold/30 shrink-0"
    />
    <div class="min-w-0">
      <p class="text-base font-extrabold leading-tight text-on-surface sm:text-lg">لوَكك</p>
      <p class="text-[11px] font-bold text-brand-gold sm:text-xs">لوحة العميل</p>
    </div>
    <button
      type="button"
      (click)="closed.emit()"
      [attr.aria-label]="'إغلاق القائمة'"
      class="ms-auto inline-flex h-8 w-8 cursor-pointer items-center justify-center rounded-lg text-on-surface-variant transition duration-200 hover:bg-surface-container hover:text-primary lg:hidden"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
    @for (link of navLinks; track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: link.exact ?? false }"
        (click)="onNavClick()"
        class="group flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-sm font-bold text-on-surface-variant transition duration-200 hover:bg-surface-container hover:text-primary"
      >
        <span
          class="client-sidebar-link-icon flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-surface-container text-primary transition duration-200 group-hover:bg-primary/15 group-hover:text-primary"
        >
          <i class="pi {{ link.icon }} text-sm"></i>
        </span>
        <span class="truncate">{{ link.label }}</span>
      </a>
    }
  </nav>

  <!-- User Card & Logout -->
  <div class="space-y-3 border-t border-outline-variant/30 p-3 sm:p-4">
    <!-- User Chip -->
    <div class="flex items-center gap-2.5 rounded-xl bg-surface-container/60 p-2.5">
      <div
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-primary/10 font-black text-primary"
      >
        <i class="pi pi-user text-xs"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-[11px] font-extrabold text-on-surface sm:text-xs">{{ userName() }}</p>
        <p class="truncate text-[10px] font-medium text-on-surface-variant sm:text-[11px]">
          {{ userPhoneOrEmail() }}
        </p>
      </div>
    </div>

    <!-- Logout Button -->
    <button
      type="button"
      (click)="onLogout()"
      class="flex w-full cursor-pointer items-center gap-2.5 rounded-xl px-3 py-2 text-sm font-bold text-red-600 transition duration-200 hover:bg-red-500/10 active:scale-[0.98]"
    >
      <span
        class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-500"
      >
        <i class="pi pi-sign-out text-xs"></i>
      </span>
      <span class="hidden sm:inline">تسجيل الخروج</span>
    </button>
  </div>
</aside>
