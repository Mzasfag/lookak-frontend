<div class="flex min-h-screen items-stretch bg-background text-on-surface">
  <!-- Sidebar: sticky column on desktop, off-canvas drawer on mobile -->
  <app-provider-sidebar [isOpen]="isSidebarOpen()" (closed)="closeSidebar()" />

  <!-- Mobile drawer backdrop -->
  @if (isSidebarOpen()) {
    <div
      data-testid="drawer-backdrop"
      class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm lg:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Main content -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Top header: salon greeting + status indicator + logout -->
    <header
      class="sticky top-0 z-20 flex items-center gap-2 border-b border-outline-variant/30 bg-surface-container-lowest/90 px-3 py-2.5 shadow-sm backdrop-blur sm:gap-3 sm:px-4 sm:py-3 lg:px-6"
    >
      <button
        type="button"
        (click)="toggleSidebar()"
        aria-label="فتح القائمة الجانبية"
        class="inline-flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-outline-variant/40 bg-surface-container/50 text-on-surface transition duration-200 hover:border-primary/40 hover:bg-primary/10 hover:text-primary active:scale-95 sm:h-10 sm:w-10 sm:rounded-xl lg:hidden"
      >
        <i class="pi pi-bars text-base"></i>
      </button>

      <!-- Greeting -->
      <div class="min-w-0 flex-1">
        <p class="truncate text-[10px] font-bold text-on-surface-variant sm:text-xs">أهلاً بك 👋</p>
        <p class="truncate text-sm font-extrabold text-on-surface sm:text-base">{{ displaySalonName() }}</p>
      </div>

      <!-- Status indicator -->
      <span
        [class]="statusPillClass()"
        class="inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-1 text-[10px] font-extrabold ring-1 sm:gap-1.5 sm:px-3 sm:py-1.5 sm:text-xs"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-current"></span>
        <span class="hidden min-[400px]:inline">{{ statusLabel() }}</span>
      </span>

      <!-- Notifications -->
      <app-notification-dropdown />
      <!-- Logout -->
      <button
        type="button"
        (click)="onLogout()"
        class="inline-flex shrink-0 cursor-pointer items-center gap-1.5 rounded-lg bg-red-500/10 px-2 py-1.5 text-xs font-extrabold text-red-600 transition duration-200 hover:bg-red-500/15 active:scale-[0.98] sm:gap-2 sm:px-3 sm:py-2 sm:text-sm"
      >
        <i class="pi pi-sign-out text-sm"></i>
        <span class="hidden sm:inline">تسجيل الخروج</span>
      </button>
    </header>

    <!-- Sub-page outlet -->
    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>
</div>
