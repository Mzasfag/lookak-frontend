<div class="flex items-stretch min-h-screen bg-background text-on-surface">
  <!-- Sidebar: sticky column on desktop, off-canvas drawer on mobile -->
  
    <app-admin-sidebar [isOpen]="isSidebarOpen()" (closed)="closeSidebar()" />


  <!-- Mobile drawer backdrop -->
  @if (isSidebarOpen()) {
    <div
      data-testid="drawer-backdrop"
      class="fixed inset-0 z-30 bg-black/40 backdrop-blur-sm lg:hidden"
      (click)="closeSidebar()"
    ></div>
  }

  <!-- Main content -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Mobile top bar -->
    <header
      class="sticky top-0 z-20 flex items-center gap-3 bg-surface-container-lowest/90 px-4 py-3 shadow-sm ring-1 ring-outline-variant/30 backdrop-blur lg:hidden"
    >
       <button
          type="button"
          (click)="toggleSidebar()"
          aria-label="فتح القائمة الجانبية"
          class="inline-flex h-10 w-10 shrink-0 cursor-pointer items-center justify-center rounded-xl border border-outline-variant/40 bg-surface-container/50 text-on-surface transition duration-200 hover:border-primary/40 hover:bg-primary/10 hover:text-primary active:scale-95 lg:hidden"
        >
          <i class="pi pi-bars text-lg"></i>
        </button>
      <span class="text-base font-extrabold text-on-surface">لوحة تحكم الإدارة</span>
      <div class="ml-auto">
        <app-notification-dropdown />
      </div>

    </header>

    <main class="min-w-0 flex-1">
      <router-outlet />
    </main>
  </div>
</div>
