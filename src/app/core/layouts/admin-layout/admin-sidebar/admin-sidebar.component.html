<aside
  [class]="isOpen() ? 'translate-x-0' : 'translate-x-full'"
  class="admin-sidebar fixed inset-y-0 right-0 z-40 flex  w-72 flex-col bg-surface-container-lowest shadow-2xl shadow-primary/10 ring-1 ring-outline-variant/20 transition-transform duration-300 lg:static lg:inset-y-auto lg:h-full lg:translate-x-0"
  aria-label="القائمة الجانبية للإدارة"
>
  <!-- Brand header -->
  <div class="flex items-center gap-3 border-b border-outline-variant/30 px-5 py-5">
    <img
      src="lookak-without-bg.png"
      alt="شعار لوَكك"
      class="h-11 w-11 rounded-full bg-brand-gold/15 object-cover p-1 ring-1 ring-brand-gold/30"
    />
    <div class="min-w-0">
      <p class="text-lg font-extrabold leading-tight text-on-surface">لوَكك</p>
      <p class="text-xs font-bold text-brand-gold">لوحة الإدارة</p>
    </div>
    <button
      type="button"
      (click)="closed.emit()"
      [attr.aria-label]="'إغلاق القائمة'"
      class="ms-auto inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg text-on-surface-variant transition duration-200 hover:bg-surface-container hover:text-primary lg:hidden"
    >
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Main navigation -->
  <nav class="flex-1 space-y-1.5 overflow-y-auto px-3 py-5">
    @for (link of navLinks; track link.route) {
      <a
        [routerLink]="link.route"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: false }"
        (click)="onNavClick()"
        [attr.aria-label]="link.label"
        class="admin-sidebar-link group flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-on-surface-variant transition duration-200 hover:bg-surface-container hover:text-primary"
      >
        <span
          class="admin-sidebar-link-icon flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-surface-container text-primary transition duration-200 group-hover:bg-brand-gold/15 group-hover:text-brand-gold"
        >
          <i class="pi {{ link.icon }} text-base"></i>
        </span>
        <span class="truncate">{{ link.label }}</span>
      </a>
    }
  </nav>

  <!-- Footer actions -->
  <div class="space-y-2 border-t border-outline-variant/30 p-4">
    <a
      routerLink="/"
      class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-on-surface-variant transition duration-200 hover:bg-surface-container hover:text-primary"
    >
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-surface-container text-primary"
      >
        <i class="pi pi-arrow-right text-base"></i>
      </span>
      العودة إلى الموقع
    </a>
    <button
      type="button"
      (click)="onLogout()"
      class="flex w-full cursor-pointer items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold text-red-600 transition duration-200 hover:bg-red-500/10"
    >
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-red-500/10 text-red-500"
      >
        <i class="pi pi-sign-out text-base"></i>
      </span>
      تسجيل الخروج
    </button>
  </div>
</aside>
